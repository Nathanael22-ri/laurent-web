<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Laurent Hardware</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'], },
                    colors: {
                        brand: { 50: '#f3f6fc', 100: '#e6edf8', 400: '#6484c4', 500: '#4a6eb3', 600: '#344f96', 900: '#1c294d' }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-left-color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 relative overflow-hidden" x-data="adminLogin()">

    <!-- Ornamen Latar Belakang -->
    <div class="absolute top-[-5%] left-[-10%] w-64 h-64 md:w-96 md:h-96 bg-brand-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
    <div class="absolute bottom-[-5%] right-[-10%] w-64 h-64 md:w-96 md:h-96 bg-brand-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>

    <!-- Kotak Login -->
    <div class="w-full max-w-md bg-white rounded-2xl sm:rounded-3xl shadow-xl sm:shadow-2xl border border-gray-100 overflow-hidden relative z-10 my-4 sm:my-8">
        
        <!-- Header Login -->
        <div class="bg-brand-900 px-6 py-6 sm:px-8 sm:py-8 text-center relative">
            <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-brand-400 via-brand-500 to-brand-600"></div>
            <div class="inline-flex items-center justify-center w-12 h-12 sm:w-16 sm:h-16 rounded-full bg-white/10 backdrop-blur-sm border border-white/20 mb-3 sm:mb-4 shadow-lg text-white">
                <svg class="w-6 h-6 sm:w-8 sm:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
            </div>
            <h2 class="text-xl sm:text-2xl font-bold text-white tracking-wide">Portal Sistem</h2>
            <p class="text-brand-100 text-xs sm:text-sm mt-1">Otorisasi Manajemen Laurent Hardware</p>
        </div>

        <!-- Form Login -->
        <div class="px-6 py-6 sm:px-8 sm:py-8">
            <!-- Alert Error -->
            <div x-show="errorMsg" x-cloak x-transition class="mb-5 sm:mb-6 p-3 sm:p-4 rounded-xl bg-red-50 border border-red-100 flex items-start gap-2.5 sm:gap-3">
                <svg class="w-4 h-4 sm:w-5 sm:h-5 text-red-500 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <p class="text-xs sm:text-sm font-medium text-red-700 leading-snug" x-text="errorMsg"></p>
            </div>

            <form @submit.prevent="doLogin" class="space-y-4 sm:space-y-6">
                <!-- Input Username -->
                <div>
                    <label class="block text-xs sm:text-sm font-semibold text-gray-700 mb-1 sm:mb-2">Username Administrator</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 sm:pl-4 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 sm:h-5 sm:w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        </div>
                        <input type="text" x-model="username" required placeholder="Masukkan username" class="block w-full pl-10 sm:pl-11 pr-4 py-2.5 sm:py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors">
                    </div>
                </div>

                <!-- Input Password -->
                <div>
                    <label class="block text-xs sm:text-sm font-semibold text-gray-700 mb-1 sm:mb-2">Kata Sandi</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 sm:pl-4 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 sm:h-5 sm:w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        </div>
                        <input :type="showPassword ? 'text' : 'password'" x-model="password" required placeholder="••••••••" class="block w-full pl-10 sm:pl-11 pr-12 py-2.5 sm:py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors">
                        
                        <button type="button" @click="showPassword = !showPassword" class="absolute inset-y-0 right-0 pr-3 sm:pr-4 flex items-center text-gray-400 hover:text-brand-600 focus:outline-none">
                            <svg x-show="!showPassword" class="h-4 w-4 sm:h-5 sm:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                            <svg x-show="showPassword" x-cloak class="h-4 w-4 sm:h-5 sm:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>
                        </button>
                    </div>
                </div>

                <!-- Tombol Submit -->
                <button type="submit" :disabled="isLoading" class="w-full flex justify-center items-center gap-2 py-3 sm:py-3.5 px-4 border border-transparent rounded-xl shadow-lg text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors disabled:opacity-70 disabled:cursor-not-allowed">
                    <span x-show="!isLoading">Masuk ke Ruang Kerja</span>
                    <div x-show="isLoading" x-cloak class="loader"></div>
                </button>
            </form>
            
            <!-- Link ke Register & Home -->
            <div class="mt-6 sm:mt-8 pt-5 sm:pt-6 border-t border-gray-100 text-center space-y-3">
                <p class="text-xs sm:text-sm text-gray-600">
                    Admin baru? 
                    <a href="register.html" class="font-bold text-brand-600 hover:text-brand-700 transition-colors">Daftar di sini</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('adminLogin', () => ({
                username: '',
                password: '',
                errorMsg: '',
                isLoading: false,
                showPassword: false,

                init() {
                    // Cek jika sudah login, langsung lempar ke admin.php
                    if (sessionStorage.getItem('admin_auth') === 'true') {
                        window.location.href = 'admin.php';
                    }
                },

                doLogin() {
                    this.errorMsg = '';
                    this.isLoading = true;

                    // Kirim kredensial ke backend PHP
                    fetch('api/login.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: this.username,
                            password: this.password
                        })
                    })
                    .then(res => res.json())
                    .then(res => {
                        if (res.status === 'success') {
                            // Simpan status auth dan nama admin ke penyimpanan browser
                            sessionStorage.setItem('admin_auth', 'true');
                            sessionStorage.setItem('admin_name', res.user.fullname);
                            window.location.href = 'admin.php';
                        } else {
                            this.errorMsg = res.message;
                            this.isLoading = false;
                        }
                    })
                    .catch(err => {
                        this.errorMsg = 'Gagal menghubungi server.';
                        this.isLoading = false;
                    });
                }
            }));
        });
    </script>
</body>
</html>
